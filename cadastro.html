<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | OrtoFisio+</title>
  <meta name="theme-color" content="#f8faf7">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="tela">
    <div class="barra">
      <button id="btn-voltar" class="botao-circulo" type="button" aria-label="Voltar">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1>Criar conta</h1>
      <span class="botao-circulo" aria-hidden="true"><img src="icons/logo.svg" alt=""></span>
    </div>

    <span id="pilula" class="pilula-etapa" aria-live="polite">Etapa 1 de 2</span>

    <div id="aviso-lento" class="alerta alerta--aviso" role="status" hidden>
      Acordando o servidor, isso pode levar até 1 minuto...
    </div>

    <form id="form-cadastro" class="formulario" novalidate style="flex:1;display:flex;flex-direction:column">
      <section class="etapa formulario" data-etapa="1" aria-labelledby="t1">
        <div>
          <h2 id="t1" class="etapa-titulo">Seus dados pessoais</h2>
          <p class="etapa-sub">Preencha as informações abaixo</p>
        </div>
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Como você se chama" required minlength="3" maxlength="150">
        </div>
        <div class="campo">
          <label for="cpf">CPF</label>
          <input id="cpf" name="cpf" type="text" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">
        </div>
        <div class="campo">
          <label for="nascimento">Data de nascimento</label>
          <input id="nascimento" name="nascimento" type="date" autocomplete="bday" required>
        </div>
      </section>

      <section class="etapa formulario" data-etapa="2" aria-labelledby="t2" hidden>
        <div>
          <h2 id="t2" class="etapa-titulo">Contato e acesso</h2>
          <p class="etapa-sub">Usaremos estes dados para você entrar</p>
        </div>
        <div class="campo">
          <label for="telefone">Telefone com DDD</label>
          <input id="telefone" name="telefone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(81) 99999-8888" required maxlength="15">
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required maxlength="150">
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" required minlength="6">
        </div>
        <div class="campo">
          <label for="senha2">Repita a senha</label>
          <input id="senha2" name="senha2" type="password" autocomplete="new-password" placeholder="Digite a senha de novo" required minlength="6">
        </div>
      </section>

      <div class="rodape-tela">
        <p id="erro" class="erro-form" role="alert"></p>
        <button id="btn-continuar" class="btn btn--grande btn--bloco" type="submit" disabled>Continuar</button>
        <p>Já tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </form>
  </main>
  <script type="module" src="js/pages/cadastro.js"></script>
</body>
</html>
